<!DOCTYPE html>
<html>

<head>

<title>For Haris Zakuwan 🤍</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Poppins:wght@300;400&display=swap');


body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #cfe8ff;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: 'Poppins', sans-serif;
}


/* tulisan utama */

.container {
    z-index: 5;
}


h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 55px;
    font-weight: 500;
    color: #2c5d8a;
    margin: 10px;
}


p {
    font-size: 17px;
    color: #456;
}



/* button */

button {

    margin-top: 25px;
    padding: 12px 30px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #2c5d8a;
    font-size: 15px;

}



/* bunga terbang */

.flower {

    position: absolute;
    bottom: -50px;
    font-size: 30px;
    animation: fly 8s linear infinite;

}


@keyframes fly {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }

}



/* love terbang */

.heart {

    position: absolute;
    bottom: -50px;
    color: #ff7fa8;
    font-size: 25px;
    animation: heartUp 7s linear infinite;

}



@keyframes heartUp {

    0% {
        transform: translateY(0);
        opacity: 1;
    }


    100% {
        transform: translateY(-100vh);
        opacity: 0;
    }

}


</style>

</head>



<body>



<div class="container">


<h1>
For Haris 🤍
</h1>


<p>
Almost 1 Year With Haris 🤍✨
</p>


<button>
Open My Heart 💌
</button>


</div>



<!-- BUNGA -->

<div class="flower" style="left:10%; animation-delay:0s;">
🌸
</div>


<div class="flower" style="left:30%; animation-delay:2s;">
🌷
</div>


<div class="flower" style="left:70%; animation-delay:1s;">
🌹
</div>


<div class="flower" style="left:85%; animation-delay:3s;">
🌸
</div>




<!-- LOVE -->

<div class="heart" style="left:20%; animation-delay:1s;">
❤️
</div>


<div class="heart" style="left:50%; animation-delay:3s;">
🤍
</div>


<div class="heart" style="left:75%; animation-delay:2s;">
❤️
</div>


<div class="heart" style="left:90%; animation-delay:4s;">
🤍
</div>



</body>

</html>
